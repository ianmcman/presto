# Builds the presto-bin tarball on a v* tag and attaches it to the GitHub Release.
# Only GITHUB_TOKEN is used. The Widevine CDM is never part of the tarball.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcursor-dev libxi-dev libxrandr-dev libasound2-dev pkg-config
      - name: Pack
        run: packaging/pack-release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --generate-notes
