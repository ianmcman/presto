[package]
name = "presto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "presto"
path = "src/lib.rs"

[[bin]]
name = "presto"
path = "src/main.rs"

[dependencies]
presto-core = { workspace = true }
presto-ipc = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
image = { workspace = true }
fastframe-text = { workspace = true }
fastframe-fonts = { workspace = true }
fastframe-icons = { workspace = true }
fastframe-theme = { workspace = true }
fastframe-i18n = { workspace = true }

[build-dependencies]
fastframe-i18n = { workspace = true, features = ["build"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
